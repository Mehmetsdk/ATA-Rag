# ATA-RAG — Production Stack (Coolify)
#
# Extends the local compose file with production-oriented settings.
# Use with Coolify or: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    restart: always
    # Coolify manages volumes — do not expose postgres port in production
    ports: !reset []

  backend:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
