# ATA-RAG — Deployment Stack
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
# DATABASE_URL can point at the local "postgres" service below, or at an
# external managed Postgres+pgvector instance (e.g. Supabase) — in that case
# the local postgres service is simply unused.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atarag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atarag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atarag_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-atarag}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atarag} -d ${POSTGRES_DB:-atarag}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atarag-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.35}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_USE_MOCK_API: ${NEXT_PUBLIC_USE_MOCK_API:-false}
    container_name: atarag-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # scraper: run on a schedule, not part of the always-on stack.
  # ---------------------------------------------------------------------------
  # scraper:
  #   build:
  #     context: ./scraper
  #     dockerfile: Dockerfile
  #   container_name: atarag-scraper
  #   environment:
  #     BASE_URL: ${BASE_URL}
  #   profiles:
  #     - scraper

volumes:
  postgres_data:

networks:
  default:
    name: atarag-network
